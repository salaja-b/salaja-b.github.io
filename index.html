<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salaja B</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      color: #1c1c1e;
      background: #fafaf8;
      line-height: 1.65;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 80px 24px 100px; }
    .eyebrow { letter-spacing: .12em; text-transform: uppercase; font-size: .78rem;
      color: #1a7f37; font-weight: 700; margin-bottom: 14px; }
    h1 { font-size: 2.6rem; line-height: 1.1; margin: 0 0 16px; letter-spacing: -.02em; }
    .lead { font-size: 1.25rem; color: #4a4a4f; margin: 0 0 40px; }
    .cards { display: grid; gap: 16px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid #e6e6e0; border-radius: 14px; padding: 22px 24px;
      background: #fff; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.06); border-color: #1a7f37; }
    a.card h2 { margin: 0 0 6px; font-size: 1.15rem; }
    a.card p { margin: 0; color: #6b6b70; font-size: .98rem; }
    footer { margin-top: 60px; color: #9a9aa0; font-size: .9rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Welcome</div>
    <h1>Hi, I'm Salaja.</h1>
    <p class="lead">Product thinking made fun, practical, &amp; profitable.</p>

    <div class="cards">
      <a class="card" href="ProductThinking.html">
        <h2>Product Thinking →</h2>
        <p>My notes and ideas on building products that people love.</p>
      </a>
    </div>

    <footer>© 2026 Salaja B · Built with GitHub Pages</footer>
  </main>
</body>
</html>
